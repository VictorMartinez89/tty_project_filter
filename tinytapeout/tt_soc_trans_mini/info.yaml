# Tiny Tapeout project information
project:
  title:        "RISC-V SoC + transitive hysteresis engine (mini)"
  author:       "Victor A. Martinez S. (UNAL)"
  discord:      ""
  description:  "A FemtoRV32 (RV32I) boots from on-chip ROM and configures a morphological-reconstruction engine that sweeps a 24x18 class frame to a fixed point, so a weak edge survives if it connects to a strong one through ANY chain. Completes the 3-filters x with/without-CPU matrix of an MSc thesis."
  language:     "Verilog"
  clock_hz:     10000000

  # ~16 870 instancias en 16 tiles = ~1 054/tile. Medido el 2026-08-30: el cuadro de la version
  # sin CPU (36x26) da 22 855 = 1 428/tile y NO cabe -el shuttle fallo a 1 378 y a 1 163-. El
  # FemtoRV32 cuesta 6 915 celdas genericas FIJAS; el motor, 8.53 por pixel. Solo se achica la imagen.
  tiles:        "8x2"

  top_module:   "tt_um_soc_trans_mini_vic"

  source_files:
    - "tt_um_soc_trans_mini_vic.v"
    - "soc_trans_top.v"
    - "trans_engine_top.v"
    - "hysteresis_frame_bram_sync.sv"
    - "femtorv32_quark.v"
    - "peripheral_filter.v"

pinout:
  ui[0]: "class_in[0] (0=nada 1=debil 2=fuerte)"
  ui[1]: "class_in[1]"
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  uo[0]: "edge_out (1 = borde reconstruido)"
  uo[1]: ""
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  uio[0]: "in_valid (in)"
  uio[1]: "out_valid (out)"
  uio[2]: "done (out)"
  uio[3]: "load_ready (out)"
  uio[4]: "cpu_wrote_filter (out)"
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
