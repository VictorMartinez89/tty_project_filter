# Tiny Tapeout project information
project:
  title:        "Sobel edge filter"
  author:       "Victor A. Martinez S. (UNAL)"
  discord:      ""
  description:  "Streaming Sobel 3x3 edge detector: |Gx|+|Gy| with shift-adds (no multipliers) and a fixed threshold. 60-pixel-wide rows. From a RISC-V + vision MSc thesis."
  language:     "Verilog"
  clock_hz:     10000000

  # ~4 651 std cells. Con 2x2 (4 tiles = ~1163 celdas/tile) el Action fallo con GPL-0302
  # (densidad pedida 0.60, sugerida 0.69). Con 3x2 quedan ~775 celdas/tile: comodo para rutear.
  tiles:        "3x2"

  top_module:   "tt_um_sobel_vic"

  source_files:
    - "tt_um_sobel_vic.v"
    - "sobel_top.v"
    - "linebuf3x3.v"

# Pines
pinout:
  ui[0]: "in_pix[0]"
  ui[1]: "in_pix[1]"
  ui[2]: "in_pix[2]"
  ui[3]: "in_pix[3]"
  ui[4]: "in_pix[4]"
  ui[5]: "in_pix[5]"
  ui[6]: "in_pix[6]"
  ui[7]: "in_pix[7]"

  uo[0]: "out_pix[0] (FF=borde / 00=plano)"
  uo[1]: "out_pix[1]"
  uo[2]: "out_pix[2]"
  uo[3]: "out_pix[3]"
  uo[4]: "out_pix[4]"
  uo[5]: "out_pix[5]"
  uo[6]: "out_pix[6]"
  uo[7]: "out_pix[7]"

  uio[0]: "in_valid (in)"
  uio[1]: "out_valid (out)"
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
