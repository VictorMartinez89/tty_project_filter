# Tiny Tapeout project information
project:
  title:        "Canny-78: MNIST digit recogniser, 97.22 % (fmem 168x9)"
  author:       "Victor A. Martinez S. (UNAL)"
  discord:      ""
  description:  "Canny 1-hop front-end -> 16-zone spatial pyramid of oriented edges -> 78 selected features -> signed 4-bit linear classifier with reject option. 97.22 % on the MNIST test set, verified 10000/10000 against the golden model and on an iCE40UP5K. From a RISC-V + vision MSc thesis (UNAL)."
  language:     "Verilog"
  clock_hz:     10000000
  # En OpenLane sky130 (24-sep): el completo da 29 449 celdas de sintesis; la variante f9 ~22 000.
  # Probablemente NO cabe en 8x2 (el maximo). Se sube para que el flujo de TT lo diga con su numero.
  tiles:        "8x2"
  top_module:   "tt_um_canny78_f9_vic"
  source_files:
    - "tt_um_canny78_f9_vic.v"
    - "mnist_top78_f9.v"
    - "mnist_feat16_mem.v"
    - "mnist_clf78_x2_f168.v"
    - "linebuf3x3.v"

pinout:
  ui[0]: "in_pix[0]  (luma 8 bits, raster 28x28)"
  ui[1]: "in_pix[1]"
  ui[2]: "in_pix[2]"
  ui[3]: "in_pix[3]"
  ui[4]: "in_pix[4]"
  ui[5]: "in_pix[5]"
  ui[6]: "in_pix[6]"
  ui[7]: "in_pix[7]"
  uo[0]: "digito[0]"
  uo[1]: "digito[1]"
  uo[2]: "digito[2]"
  uo[3]: "digito[3]"
  uo[4]: "valido (0 = NADA)"
  uo[5]: "done (pulso: hay veredicto)"
  uo[6]: ""
  uo[7]: ""
  uio[0]: "in_valid (in)"
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

yaml_version: 6
