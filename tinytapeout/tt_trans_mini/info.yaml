# Tiny Tapeout project information
project:
  title:        "Transitive hysteresis engine (mini)"
  author:       "Victor A. Martinez S. (UNAL)"
  discord:      ""
  description:  "Morphological-reconstruction engine for Canny hysteresis: sweeps a whole 32x24 class frame until a fixed point, so a weak pixel survives if it is connected to a strong one through ANY chain of weak neighbours. The full-size 80x60 version needs ~53 tiles; this one fits."
  language:     "Verilog"
  clock_hz:     10000000

  # ~7 736 celdas genericas (yosys) -> ~10 400 en sky130 -> ~10 tiles
  tiles:        "6x2"

  top_module:   "tt_um_trans_mini_vic"

  source_files:
    - "tt_um_trans_mini_vic.v"
    - "hysteresis_frame_bram_sync.sv"

pinout:
  ui[0]: "class_in[0] (0=nada 1=debil 2=fuerte)"
  ui[1]: "class_in[1]"
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  uo[0]: "edge_out (1 = borde reconstruido)"
  uo[1]: ""
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  uio[0]: "in_valid (in)"
  uio[1]: "out_valid (out)"
  uio[2]: "done (out)"
  uio[3]: "load_ready (out)"
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
