# Tiny Tapeout project information
project:
  title:        "MNIST digit recognizer (Canny 1-hop front-end)"
  author:       "Victor A. Martinez S. (UNAL)"
  discord:      ""
  description:  "A chip that RECOGNISES instead of drawing: Canny 1-hop (Gaussian -> Sobel -> dual threshold -> 1-hop hysteresis) -> 32-bin oriented-gradient histogram -> 40-feature spatial pyramid -> 400 signed 4-bit MACs -> argmax -> a digit 0-9, or NOTHING. The 400 weights live in combinational ROM and cost no flip-flops. From a RISC-V + vision MSc thesis."
  language:     "Verilog"
  clock_hz:     10000000

  # ~15 850 celdas sky130 estimadas (8 130 genericas x 1.95, factor MEDIDO en
  # tt_soc_sobel 7185->13922 y tt_soc_canny1 8314->16368).
  # En 6x2 quedaria a ~62 % de utilizacion, por encima del 61 % que fue el maximo
  # que ruteo en esta serie (tt_canny1). En 8x2 queda a ~45 %: comodo. Es el front-end que dio 9/10 en la iCE40.
  tiles:        "8x2"

  top_module:   "tt_um_mnist_canny_vic"

  source_files:
    - "tt_um_mnist_canny_vic.v"
    - "mnist_top_canny_fw.v"
    - "mnist_feat_canny.v"
    - "mnist_clf_canny_fw.v"
    - "linebuf3x3.v"

pinout:
  ui[0]: "in_pix[0]  (luma de 8 bits, orden raster de la ventana 28x28)"
  ui[1]: "in_pix[1]"
  ui[2]: "in_pix[2]"
  ui[3]: "in_pix[3]"
  ui[4]: "in_pix[4]"
  ui[5]: "in_pix[5]"
  ui[6]: "in_pix[6]"
  ui[7]: "in_pix[7]"

  uo[0]: "digito[0]  (0..9)"
  uo[1]: "digito[1]"
  uo[2]: "digito[2]"
  uo[3]: "digito[3]"
  uo[4]: "valido     (0 = NADA: el chip no se cree su respuesta)"
  uo[5]: "done       (pulso: hay veredicto)"
  uo[6]: ""
  uo[7]: ""

  uio[0]: "in_valid (in)"
  uio[1]: "clr      (in)  limpia el histograma para el cuadro siguiente"
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

yaml_version: 6
