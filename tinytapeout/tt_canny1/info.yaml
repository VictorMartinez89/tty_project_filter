# Tiny Tapeout project information
project:
  title:        "Canny 1-streaming edge filter"
  author:       "Victor A. Martinez S. (UNAL)"
  discord:      ""
  description:  "Streaming Canny edge detector: Gaussian 3x3 -> Sobel 3x3 -> double threshold -> 1-hop hysteresis. 60-pixel-wide rows. From a RISC-V + vision MSc thesis."
  language:     "Verilog"
  clock_hz:     10000000

  # 10284 celdas en 12 tiles = ~857/tile (regla: ~800/tile). Densidad 65 % en src/config.json.
  tiles:        "6x2"

  top_module:   "tt_um_canny1_vic"

  source_files:
    - "tt_um_canny1_vic.v"
    - "canny1_top.v"
    - "linebuf3x3.v"

# Pines
pinout:
  ui[0]: "in_pix[0]"
  ui[1]: "in_pix[1]"
  ui[2]: "in_pix[2]"
  ui[3]: "in_pix[3]"
  ui[4]: "in_pix[4]"
  ui[5]: "in_pix[5]"
  ui[6]: "in_pix[6]"
  ui[7]: "in_pix[7]"

  uo[0]: "out_pix[0] (FF=borde / 00=plano)"
  uo[1]: "out_pix[1]"
  uo[2]: "out_pix[2]"
  uo[3]: "out_pix[3]"
  uo[4]: "out_pix[4]"
  uo[5]: "out_pix[5]"
  uo[6]: "out_pix[6]"
  uo[7]: "out_pix[7]"

  uio[0]: "in_valid (in)"
  uio[1]: "out_valid (out)"
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
