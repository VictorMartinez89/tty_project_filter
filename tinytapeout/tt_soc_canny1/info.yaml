# Tiny Tapeout project information
project:
  title:        "RISC-V SoC + Canny 1-streaming edge filter"
  author:       "Victor A. Martinez S. (UNAL)"
  discord:      ""
  description:  "Self-contained RISC-V SoC: a FemtoRV32 (RV32I) runs firmware from a synthesized ROM to configure an on-chip streaming Canny edge detector (both thresholds, 90/40). No external memory. From a vision MSc thesis."
  language:     "Verilog"
  clock_hz:     10000000

  # ~22 054 std cells: por encima del presupuesto estimado (~1000 celdas/tile x 16 tiles).
  # Se pide el maximo y se deja que el Action de TT diga la verdad.
  tiles:        "8x2"

  top_module:   "tt_um_soc_canny1_vic"

  source_files:
    - "tt_um_soc_canny1_vic.v"
    - "soc_canny1_top.v"
    - "canny1_top.v"
    - "femtorv32_quark.v"
    - "peripheral_filter.v"
    - "linebuf3x3.v"

pinout:
  ui[0]: "in_pix[0]"
  ui[1]: "in_pix[1]"
  ui[2]: "in_pix[2]"
  ui[3]: "in_pix[3]"
  ui[4]: "in_pix[4]"
  ui[5]: "in_pix[5]"
  ui[6]: "in_pix[6]"
  ui[7]: "in_pix[7]"

  uo[0]: "out_pix[0] (FF=borde / 00=plano)"
  uo[1]: "out_pix[1]"
  uo[2]: "out_pix[2]"
  uo[3]: "out_pix[3]"
  uo[4]: "out_pix[4]"
  uo[5]: "out_pix[5]"
  uo[6]: "out_pix[6]"
  uo[7]: "out_pix[7]"

  uio[0]: "in_valid (in)"
  uio[1]: "out_valid (out)"
  uio[2]: "cpu_wrote_filter (out)"
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
